<!DOCTYPE html>
<html>
<head>
    <title>Career Predictor - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Login to Your Account</h2>
        
        <div id="messageBox" style="display: none; padding: 10px; margin-bottom: 10px; border-radius: 5px;"></div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>

            <input type="submit" value="Login" style="margin-top: 15px;">
            
            <p style="margin-top: 15px; font-size: 14px; color: #4a5568;">
                Don't have an account? <a href="register.html" style="color: #667eea; text-decoration: none; font-weight: 600;">Register here</a>
            </p>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const messageBox = document.getElementById("messageBox");

            try {
                const response = await fetch("http://localhost:5000/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                messageBox.style.display = "block";

                if (response.ok && data.success) {
                    messageBox.style.backgroundColor = "#d4edda";
                    messageBox.style.color = "#155724";
                    messageBox.innerText = data.message;
                    
                    // Save token to localStorage
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("role", data.role);
                    localStorage.setItem("email", data.email);
                    localStorage.setItem("name", data.name);

                    // Redirect to the main application page
                    setTimeout(() => {
                        window.location.href = "questions.html";
                    }, 1500);
                } else {
                    messageBox.style.backgroundColor = "#f8d7da";
                    messageBox.style.color = "#721c24";
                    messageBox.innerText = data.error || "Login failed";
                }
            } catch (error) {
                console.error("Login error:", error);
                messageBox.style.display = "block";
                messageBox.style.backgroundColor = "#f8d7da";
                messageBox.style.color = "#721c24";
                messageBox.innerText = "Network error occurred";
            }
            return false;
        }
    </script>
</body>
</html>
