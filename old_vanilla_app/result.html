<!DOCTYPE html>
<html>
<head>
<title>Result Analysis</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    background: #f4f4f4;
}

.container {
    width: 60%;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0px 0px 10px #ccc;
}

canvas {
    max-width: 300px;
    margin: auto;
}
</style>

</head>

<body>

<div class="container">

<h2>Career Analysis Result</h2>

<h3 id="studentName"></h3>
<h3 id="course"></h3>

<hr>

<h3 id="score"></h3>
<h3 id="percentage"></h3>
<h3 id="feedback"></h3>
<h3 id="recommendation"></h3>

<canvas id="myChart"></canvas>

</div>

<script>

// ===============================
// GET DATA FROM LOCAL STORAGE
// ===============================
let name = localStorage.getItem("userName") || "N/A";
let subject = localStorage.getItem("selectedSubject") || "N/A";
let course = localStorage.getItem("selectedCourse") || "N/A";
let score = Number(localStorage.getItem("score")) || 0;
let percentage = Number(localStorage.getItem("percentage")) || 0;
let feedback = localStorage.getItem("feedback") || "No Feedback";

// ===============================
// RECOMMENDATION LOGIC
// ===============================
let recommendation = "";

if (percentage >= 80) {
    recommendation = "🔥 Excellent Fit For This Subject";
}
else if (percentage >= 60) {
    recommendation = "👍 Moderate Fit";
}
else {
    recommendation = "⚠ Needs More Preparation";
}

// ===============================
// DISPLAY DATA
// ===============================
document.getElementById("studentName").innerText = "Name: " + name;
document.getElementById("course").innerText = "Subject: " + subject + " (" + course + ")";

document.getElementById("score").innerText = "Score: " + score;
document.getElementById("percentage").innerText = "Percentage: " + percentage + "%";

document.getElementById("feedback").innerText = "Feedback: " + feedback;
document.getElementById("recommendation").innerText = "Result: " + recommendation;

// ===============================
// CHART.JS GRAPH
// ===============================
new Chart(document.getElementById("myChart"), {
    type: "doughnut",
    data: {
        labels: ["Achieved", "Remaining"],
        datasets: [{
            data: [percentage, 100 - percentage]
        }]
    },
    options: {
        responsive: true
    }
});

</script>

</body>
</html>
